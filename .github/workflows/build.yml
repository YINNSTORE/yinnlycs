name: Build APKs

on:
  # beta is the branch testers follow; pushes there publish tester APKs.
  # The V8.1 polish branch is also included so its changes can be CI-validated.
  # main moves through the beta -> main pull request and is what releases are cut from.
  push:
    branches: [ main, master, beta, fix/yinnlycs-v8-1-indonesian-polish ]
  pull_request:
    branches: [ main, master, beta, fix/yinnlycs-v8-requested-fixes ]
  workflow_dispatch:

# Least privilege by default: no job gets a token unless it asks for one below.
permissions: {}

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TELEGRAM_APK_CHAT_ID: "@ivorisnoob_chat"

jobs:
  # Nothing builds until this job says the run was started by someone with write
  # access to this repository. Every other job hangs off it via `needs`, so an
  # untrusted PR costs a few seconds of a runner and stops.
  authorize:
    name: Authorize run
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
      is-fork-pr: ${{ steps.gate.outputs.is-fork-pr }}
    steps:
      - name: Check the actor is the owner or a trusted collaborator
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          # Computed by GitHub from repo membership; a PR author cannot set it.
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # Optional repo variable, a space separated list of logins the owner
          # wants treated as trusted (Settings > Secrets and variables > Actions).
          # Commas are tolerated here; the release gate in telegram-notify.yml
          # matches on spaces, so prefer spaces.
          EXTRA_TRUSTED: ${{ vars.TRUSTED_ACTORS }}
        run: |
          set -euo pipefail

          # Bots that push on the owner's behalf. Everything else has to earn it
          # through repository membership.
          # read -a splits on whitespace without pathname expansion, which the
          # bracketed bot logins need: unquoted `claude[bot]` is a glob pattern.
          read -r -a TRUSTED <<< "${REPO_OWNER} claude claude[bot] claude-bot claude-code[bot] ${EXTRA_TRUSTED//,/ }"

          actor_is_trusted() {
            local candidate
            for candidate in "${TRUSTED[@]}"; do
              if [ "${candidate,,}" = "${ACTOR,,}" ]; then
                return 0
              fi
            done
            return 1
          }

          allowed=false
          is_fork_pr=false
          reason=""

          case "${EVENT_NAME}" in
            pull_request)
              if [ "${PR_HEAD_REPO}" = "${REPO}" ]; then
                # A branch can only exist in this repo if someone with write
                # access pushed it, so a same-repo PR is authorized by construction.
                allowed=true
                reason="same-repo pull request"
              else
                is_fork_pr=true
                case "${PR_ASSOCIATION}" in
                  # To also let previously merged contributors build fork PRs,
                  # add CONTRIBUTOR to this list. Left out on purpose: it is not
                  # a permission the owner granted.
                  OWNER|MEMBER|COLLABORATOR)
                    allowed=true
                    reason="fork pull request from ${PR_ASSOCIATION}"
                    ;;
                  *)
                    reason="fork pull request from ${PR_ASSOCIATION:-NONE}"
                    ;;
                esac
              fi
              ;;
            push|workflow_dispatch)
              if actor_is_trusted; then
                allowed=true
                reason="${EVENT_NAME} by trusted actor"
              else
                reason="${EVENT_NAME} by untrusted actor"
              fi
              ;;
            *)
              reason="unhandled event ${EVENT_NAME}"
              ;;
          esac

          echo "allowed=${allowed}" >> "$GITHUB_OUTPUT"
          echo "is-fork-pr=${is_fork_pr}" >> "$GITHUB_OUTPUT"

          if [ "${allowed}" = "true" ]; then
            echo "Authorized: ${ACTOR} (${reason})." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Build skipped"
              echo ""
              echo "\`${ACTOR}\` is not the repository owner or a collaborator (${reason})."
              echo "A maintainer can run this build by pushing the change to a branch in this repository."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build-debug:
    name: Build Debug APK
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/fix/yinnlycs-v8-1-indonesian-polish')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug


  build-release:
    name: Build Release APK
    needs: authorize
    # Fork PRs are kept out of the release job. Same-repository PRs can validate
    # the release variant; only trusted non-PR runs publish a downloadable APK.
    if: needs.authorize.outputs.allowed == 'true' && needs.authorize.outputs.is-fork-pr != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Telegram changelogs are computed from the last successfully delivered
        # beta head, which can be older than checkout's default shallow history.
        # Full depth also brings origin/main, the fallback starting point.
        fetch-depth: 0
        persist-credentials: false

    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Prepare release signing key
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        mkdir -p keystore

        # Use the owner's persistent signing key only when all credentials are
        # present and the keystore can actually be opened. Never decode an empty
        # secret over the keystore path.
        if [[ -n "${KEYSTORE_BASE64:-}" && -n "${KEYSTORE_PASSWORD_SECRET:-}" && -n "${KEY_ALIAS_SECRET:-}" && -n "${KEY_PASSWORD_SECRET:-}" ]]; then
          if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/ivormusic.jks 2>/dev/null \
            && keytool -list -keystore keystore/ivormusic.jks -storepass "$KEYSTORE_PASSWORD_SECRET" -alias "$KEY_ALIAS_SECRET" >/dev/null 2>&1; then
            {
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET"
              echo "KEY_ALIAS=$KEY_ALIAS_SECRET"
              echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET"
            } >> "$GITHUB_ENV"
            echo "Using the configured persistent release signing key."
          else
            echo "::warning::Configured keystore could not be validated; generating a temporary CI key."
            rm -f keystore/ivormusic.jks
          fi
        else
          echo "Release signing secrets are not configured; generating a temporary CI key."
          rm -f keystore/ivormusic.jks
        fi

        if [[ ! -s keystore/ivormusic.jks ]]; then
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_ALIAS_VALUE="yinnlycs-ci"
          keytool -genkeypair -v \
            -keystore keystore/ivormusic.jks \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -alias "$KEY_ALIAS_VALUE" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Yinnlycs, OU=CI, O=YINNSTORE, C=ID" -noprompt
          {
            echo "KEYSTORE_PASSWORD=$STORE_PASS"
            echo "KEY_ALIAS=$KEY_ALIAS_VALUE"
            echo "KEY_PASSWORD=$STORE_PASS"
          } >> "$GITHUB_ENV"
          echo "::warning::This run uses a temporary signing key. To install future builds as updates without uninstalling, configure a persistent keystore in GitHub Actions secrets."
        fi

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Upload Release APK artifact (pull request)
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: yinnlycs-v8-release-arm64
        path: app/build/outputs/apk/release/*arm64-v8a*.apk
        if-no-files-found: error
        retention-days: 14

    - name: Publish direct APK download
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        APK_SOURCE=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*arm64-v8a*.apk' -print -quit)
        if [[ -z "$APK_SOURCE" ]]; then
          echo "No arm64-v8a APK was produced." >&2
          find app/build/outputs/apk/release -maxdepth 2 -type f -print || true
          exit 1
        fi

        APK_NAME="Yinnlycs-arm64-v8a.apk"
        cp "$APK_SOURCE" "$APK_NAME"
        APK_SIZE=$(du -h "$APK_NAME" | cut -f1)
        TAG="ci-latest"
        NOTES=$(printf 'Latest Yinnlycs CI build.\n\nCommit: %s\nBranch: %s\nABI: arm64-v8a\nAPK size: %s\n\nFor 64-bit Android devices.' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$APK_SIZE")

        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          gh release upload "$TAG" "$APK_NAME" --clobber --repo "$REPO"
          gh release edit "$TAG" --title "Yinnlycs latest APK" --notes "$NOTES" --prerelease --repo "$REPO"
        else
          gh release create "$TAG" "$APK_NAME" --title "Yinnlycs latest APK" --notes "$NOTES" --prerelease --target "$GITHUB_SHA" --repo "$REPO"
        fi

        DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/${APK_NAME}"
        echo "APK size: ${APK_SIZE}" >> "$GITHUB_STEP_SUMMARY"
        echo "Direct APK download: ${DOWNLOAD_URL}" >> "$GITHUB_STEP_SUMMARY"
        echo "::notice title=Direct APK download::${DOWNLOAD_URL}"

    # Testers follow one branch. A pull request builds its APKs as artifacts and
    # posts nothing; the post happens when the work lands on beta. Posting per
    # pull request meant two open ones took turns being "Latest beta", each
    # without the other's changes and each with a changelog measured from its
    # own last build rather than from the APK the tester had installed.
    - name: Send Release APKs to Telegram
      if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ env.TELEGRAM_APK_CHAT_ID }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        BETA_BRANCH: ${{ github.ref_name }}
        HEAD_SHA: ${{ github.sha }}
        # Where a beta's changelog starts when there is no earlier delivery to
        # measure from: everything beta has that this branch does not.
        RELEASE_BRANCH: main
      run: |
        set -euo pipefail

        esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' <<< "$1"; }

        telegram_ok() {
          jq -e '.ok == true' >/dev/null 2>&1 <<< "$1"
        }

        send_plain_message() {
          local message="$1" response
          response=$(curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${message}")
          if ! telegram_ok "$response"; then
            echo "Telegram changelog send failed: ${response}"
            exit 1
          fi
        }

        VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts || echo "unknown")
        RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

        CAPTION="<b>Latest beta</b> · Yinnlycs v${VERSION}

        SHA: <code>${HEAD_SHA::7}</code>
        <a href=\"${RUN_URL}\">Workflow Run</a>"

        # Find the head SHA from the last successful push run on the beta
        # branch. Canceled and failed runs are deliberately absent, so their
        # commit changelogs roll forward into the next APK that is delivered.
        ENCODED_BRANCH=$(jq -rn --arg value "$BETA_BRANCH" '$value | @uri')
        RUNS_URL="${GITHUB_API_URL}/repos/${REPO}/actions/workflows/build.yml/runs?event=push&status=success&branch=${ENCODED_BRANCH}&per_page=100"
        if ! RUNS_JSON=$(curl -fsSL \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "$RUNS_URL"); then
          echo "Could not read workflow history; falling back to everything ${BETA_BRANCH} has over ${RELEASE_BRANCH}."
          RUNS_JSON='{"workflow_runs":[]}'
        fi

        LAST_SENT_SHA=$(jq -r --arg repo "$REPO" --arg run_id "$RUN_ID" '
          [
            .workflow_runs[]?
            | select((.id | tostring) != $run_id)
            | select(.head_repository.full_name == $repo)
          ]
          | sort_by(.created_at)
          | reverse
          | .[0].head_sha // empty
        ' <<< "$RUNS_JSON" 2>/dev/null || true)

        if [ -n "$LAST_SENT_SHA" ] \
          && git cat-file -e "${LAST_SENT_SHA}^{commit}" 2>/dev/null \
          && git merge-base --is-ancestor "$LAST_SENT_SHA" "$HEAD_SHA"; then
          CHANGELOG_START_SHA="$LAST_SENT_SHA"
          echo "Collecting Telegram changelogs after successful run head ${LAST_SENT_SHA:0:7}."
        else
          # First delivery, unavailable history, or a rewritten beta: include
          # everything beta has that the release branch does not. Repeating an
          # entry is safer than losing it.
          CHANGELOG_START_SHA=$(git merge-base "origin/${RELEASE_BRANCH}" "$HEAD_SHA" 2>/dev/null || true)
          echo "Collecting Telegram changelogs from the ${RELEASE_BRANCH} merge base ${CHANGELOG_START_SHA:0:7}."
        fi

        if [ -n "$CHANGELOG_START_SHA" ]; then
          mapfile -t NEW_COMMITS < <(git rev-list --reverse "${CHANGELOG_START_SHA}..${HEAD_SHA}")
        else
          # No shared history with the release branch to measure from. Deliver
          # the APK with the head commit's entry rather than nothing.
          NEW_COMMITS=("$HEAD_SHA")
        fi

        # Nothing has landed since the last delivery: beta was created or
        # fast-forwarded onto a commit testers already have. Posting it again
        # would only move the pin onto an identical APK.
        if [ "${#NEW_COMMITS[@]}" -eq 0 ]; then
          echo "No commits since ${CHANGELOG_START_SHA:0:7}; testers already have this build. Nothing posted."
          echo "Beta post skipped: no commits since the last delivered APK." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        extract_changelog() {
          git show -s --format=%B "$1" | awk '
            /^Changelog:[[:space:]]*$/ { found = 1; next }
            # Git trailers sit after the changelog; they are not changelog.
            # Matched by shape ("Token: value", a hyphenated word then a
            # colon) rather than by a list of names, so a trailer nobody
            # listed - Claude-Session did exactly this - cannot leak into
            # the post. Changelog lines are "- " bullets and never match.
            found && $0 ~ /^[A-Za-z][A-Za-z0-9]*(-[A-Za-z0-9]+)*:[[:space:]]/ { next }
            found { lines[++count] = $0 }
            END {
              first = 1
              while (first <= count && lines[first] ~ /^[[:space:]]*$/) first++
              last = count
              while (last >= first && lines[last] ~ /^[[:space:]]*$/) last--
              for (i = first; i <= last; i++) print lines[i]
            }
          '
        }

        CHANGELOG_FILE=$(mktemp)
        trap 'rm -f "$CHANGELOG_FILE"' EXIT
        ENTRY_COUNT=0
        printf 'Changes since the last APK\n' > "$CHANGELOG_FILE"

        for commit in "${NEW_COMMITS[@]}"; do
          CHANGELOG=$(extract_changelog "$commit")
          if [ -z "${CHANGELOG//[[:space:]]/}" ]; then
            continue
          fi
          SUBJECT=$(git show -s --format=%s "$commit")
          printf '\n%s (%s)\n%s\n' "$SUBJECT" "${commit:0:7}" "$CHANGELOG" >> "$CHANGELOG_FILE"
          ENTRY_COUNT=$((ENTRY_COUNT + 1))
        done

        # Commits that say nothing to testers and touch nothing an APK is built
        # from (docs, workflows, README art) would only move the pin onto a
        # build identical to the one already there. Any path not listed counts
        # as an app change, so a gap in this list posts rather than skips, and
        # a range with a changelog entry is always delivered.
        if [ "$ENTRY_COUNT" -eq 0 ] && [ -n "$CHANGELOG_START_SHA" ]; then
          CHANGED_PATHS=$(git diff --name-only "$CHANGELOG_START_SHA" "$HEAD_SHA")
          APP_PATHS=$(grep -Ev '^(docs/|\.github/|Screenshots/|[^/]+\.md$|LICENSE$|\.gitignore$)' \
            <<< "$CHANGED_PATHS" || true)
          if [ -z "${APP_PATHS//[[:space:]]/}" ]; then
            echo "Only docs and workflow files changed since ${CHANGELOG_START_SHA:0:7}. Nothing posted."
            echo "Beta post skipped: nothing in the APK changed since the last delivered one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
        fi

        if [ "$ENTRY_COUNT" -eq 0 ]; then
          printf '\nNo public changelog entries were included in the new commits.\n' >> "$CHANGELOG_FILE"
        fi

        # Keep only the newest beta pinned. Reading the old id before sending
        # lets us pin the replacement first, so a permissions/API failure never
        # leaves the channel without its previous useful pin.
        PINNED_MESSAGE_ID=""
        CHAT_RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/getChat" \
          --data-urlencode "chat_id=${CHAT_ID}" || true)
        if telegram_ok "$CHAT_RESPONSE"; then
          PINNED_MESSAGE_ID=$(jq -r '.result.pinned_message.message_id // empty' \
            <<< "$CHAT_RESPONSE")
        else
          echo "Could not read the previous Telegram pin; continuing without removing it."
        fi

        APK_MESSAGE_ID=""
        for apk in app/build/outputs/apk/release/*arm64-v8a*.apk; do
          SIZE=$(stat -c%s "$apk")
          if [ "$SIZE" -gt 50000000 ]; then
            RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "parse_mode=HTML" \
              --data-urlencode "text=<b>Latest beta</b> · Yinnlycs v${VERSION}

        $(esc "$(basename "$apk")") is over Telegram's 50 MB bot limit — grab it from the <a href=\"https://github.com/${REPO}/releases/download/ci-latest/Yinnlycs-arm64-v8a.apk\">direct APK download</a>.")
            if ! telegram_ok "$RESPONSE"; then
              echo "Telegram artifact-link send failed: ${RESPONSE}"
              exit 1
            fi
            APK_MESSAGE_ID=$(jq -r '.result.message_id // empty' <<< "$RESPONSE")
            continue
          fi
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            --form-string "chat_id=${CHAT_ID}" \
            --form-string "parse_mode=HTML" \
            --form-string "caption=${CAPTION}" \
            -F "document=@${apk}")
          if ! telegram_ok "$RESPONSE"; then
            echo "Telegram APK send failed: ${RESPONSE}"
            exit 1
          fi
          APK_MESSAGE_ID=$(jq -r '.result.message_id // empty' <<< "$RESPONSE")
        done

        if [ -n "$APK_MESSAGE_ID" ]; then
          PIN_RESPONSE=$(curl -sS -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/pinChatMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "message_id=${APK_MESSAGE_ID}" \
            --data-urlencode "disable_notification=true" || true)
          if telegram_ok "$PIN_RESPONSE"; then
            echo "Pinned latest beta message ${APK_MESSAGE_ID} without notification."
            if [ -n "$PINNED_MESSAGE_ID" ] &&
              [ "$PINNED_MESSAGE_ID" != "$APK_MESSAGE_ID" ]; then
              UNPIN_RESPONSE=$(curl -sS -X POST \
                "https://api.telegram.org/bot${BOT_TOKEN}/unpinChatMessage" \
                --data-urlencode "chat_id=${CHAT_ID}" \
                --data-urlencode "message_id=${PINNED_MESSAGE_ID}" || true)
              if ! telegram_ok "$UNPIN_RESPONSE"; then
                echo "Could not remove previous Telegram pin ${PINNED_MESSAGE_ID}; new beta remains pinned."
              fi
            fi
          else
            echo "Could not pin latest beta message; APK delivery succeeded and the previous pin was kept."
          fi
        else
          echo "Telegram did not return an APK message id; skipping pin update."
        fi

        # Telegram counts message length in UTF-16 units. Split on complete
        # Unicode characters, preferring line boundaries, with room below 4096.
        mapfile -d '' -t CHANGELOG_CHUNKS < <(
          python3 - "$CHANGELOG_FILE" <<'PY'
        import sys

        limit = 3800
        text = open(sys.argv[1], encoding="utf-8").read()

        def units(value):
            return len(value.encode("utf-16-le")) // 2

        chunks = []
        current = ""
        for line in text.splitlines(keepends=True):
            while units(line) > limit:
                if current:
                    chunks.append(current.rstrip())
                    current = ""
                used = 0
                cut = 0
                for cut, char in enumerate(line, start=1):
                    char_units = units(char)
                    if used + char_units > limit:
                        cut -= 1
                        break
                    used += char_units
                chunks.append(line[:cut].rstrip())
                line = line[cut:]

            candidate = current + line
            if current and units(candidate) > limit:
                chunks.append(current.rstrip())
                current = line
            else:
                current = candidate

        if current.strip():
            chunks.append(current.rstrip())

        for chunk in chunks:
            sys.stdout.buffer.write(chunk.encode("utf-8") + b"\0")
        PY
        )

        for chunk in "${CHANGELOG_CHUNKS[@]}"; do
          send_plain_message "$chunk"
        done
